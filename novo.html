<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova aula</title>
<meta name="description" content="Cadastra uma aula nova na biblioteca e abre o editor para escrever.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav><a href="index.html">&larr; Voltar para o início</a></nav>
<main>

<h1>Nova aula</h1>
<p>Preencha e clique em criar. A aula é cadastrada e o editor abre em seguida para você escrever.</p>

<form id="form-aula" autocomplete="off">

<div class="campo">
<label for="titulo">Título da aula</label>
<input type="text" id="titulo" placeholder="Ex: Endereçamento IPv6 na prática" required>
</div>

<div class="campo-duplo">
<div class="campo">
<label for="materia">Matéria</label>
<input type="text" id="materia" list="materias-existentes" placeholder="Ex: Redes de Computadores" required>
<datalist id="materias-existentes"></datalist>
</div>
<div class="campo campo-estreito">
<label for="numero">Nº da aula</label>
<input type="number" id="numero" min="1" step="1" value="1" required>
</div>
</div>

<div class="campo-duplo">
<div class="campo">
<label for="data">Data da anotação</label>
<input type="date" id="data" required>
</div>
<div class="campo campo-estreito">
<label for="status">Status</label>
<select id="status">
<option value="rascunho">rascunho</option>
<option value="pronto">pronto</option>
</select>
</div>
</div>

<div class="campo">
<label for="resumo">Resumo <span class="dica">uma linha sobre o conteúdo</span></label>
<input type="text" id="resumo" placeholder="Ex: Como funciona o endereçamento IPv6 e por que ele substitui o IPv4." required>
</div>

<div class="campo">
<label for="tags">Tags <span class="dica">separadas por vírgula, usadas na busca</span></label>
<input type="text" id="tags" placeholder="Ex: ipv6, enderecamento, redes">
</div>

<p class="previa">Vai criar: <code id="saida-caminho">…</code></p>

<div class="acoes">
<button type="submit" id="criar" class="botao">Criar e escrever</button>
</div>

</form>

<div id="recado" class="recado" hidden></div>

<script src="dados/aulas.js"></script>
<script src="assets/js/novo.js"></script>
</body>
</html>
